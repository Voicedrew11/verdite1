read_only = "a raw write sets the id but not equipped_body_armor_record, which the equip code sets beside it (src/game/player_core.cpp) and player_update_equipment_effects (src/game/player_update.cpp) dereferences whenever the id is not KF_OBJECT_NONE: a null reference, found by the fuzzer (raw-write mode, seeds 26 and 32). The range is the window the id may take when set by the game."
why = "An armour id: armor_records.entries[id - KF_ITEM_IRON_MASK] (42 entries) with no check in player_compute_combat_stats (src/game/player_death.cpp); the same window in save_state_valid (src/game/save_system.cpp)."

