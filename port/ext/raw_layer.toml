# The listed file of the raw layer (docs/RAW_LAYER_PLAN.md), read by tools/raw_layer.py.
#
# Every key names something in the decomp's headers: a field as "Struct.field", a global by its
# name, an enum by its name, a union member as "Owner.member". A key that names nothing fails the
# generator, so a rename in the decomp stops the build instead of leaving a stale range.
#
#   range     [min, max], or the name of a global array (0 to its length - 1). It must fit the
#             field's storage, and it narrows every integer or enum the field reaches.
#   why       the field's doc in the definitions file, and where the game uses it.
#   alias     the name Lua sees, when the decomp's is not the one a mod should use.
#   read_only why a field is not writable.
#
# Nothing here lists what is exposed: that is every named global and struct field the generator can
# describe (see the report it writes). It lists what the game needs a range for, and what is held back.

# --- Class template instances. An extern global of an instance does not complete it, so the
# generator's umbrella instantiates each listed one explicitly; the floor grids need this.

[templates]
instances = [
    "KfMapCells<unsigned char>",
    "KfMapCells<KfMapAttribute>",
    "KfMapCells<KfMapCellKind>",
    "KfMapCells<KfMapOrientation>",
]

# --- Equipment ids: each is an index the game uses with no check, so a range is the game's own bound.
# KF_OBJECT_NONE (0xff, nothing equipped) is outside every range below: a range is one interval, so
# a raw write cannot unequip a slot. That is a gap in raw.h (RawRange holds one interval).

[fields."KfPlayerState.equipped_weapon_id"]
range = [0, 15]
read_only = "a raw write sets the id but not equipped_weapon_record, which the equip code sets beside it (src/game/player_core.cpp) and player_update_equipment_effects (src/game/player_update.cpp) dereferences whenever the id is not KF_OBJECT_NONE: a null reference, found by the fuzzer (raw-write mode, seeds 26 and 32). The range is the window the id may take when set by the game."
why = "A weapon id: weapon_records.entries[id] (16 entries, KF_WEAPON_RECORD_COUNT) with no check in player_compute_combat_stats (src/game/player_death.cpp) and menu_draw_equipment_names (src/game/menu_runtime.cpp); save_state_valid accepts only KF_OBJECT_NONE or a count below 16 (src/game/save_system.cpp)."

[fields."KfPlayerState.equipped_head_armor_id"]
range = [13, 54]
read_only = "a raw write sets the id but not equipped_head_armor_record, which the equip code sets beside it (src/game/player_core.cpp) and player_update_equipment_effects (src/game/player_update.cpp) dereferences whenever the id is not KF_OBJECT_NONE: a null reference, found by the fuzzer (raw-write mode, seeds 26 and 32). The range is the window the id may take when set by the game."
why = "An armour id: armor_records.entries[id - KF_ITEM_IRON_MASK] (42 entries, KF_ARMOR_RECORD_COUNT) with no check in player_compute_combat_stats (src/game/player_death.cpp); save_state_valid rejects an id outside that window (src/game/save_system.cpp). menu_resources().items[id] reads it too (menu_draw_equipment_names)."

